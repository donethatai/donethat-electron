# Required "AI review" status: passes once Codex (ChatGPT Codex Connector, automatic reviews)
# has reviewed the pull request's latest commit. Codex leaves a review on that commit when it
# has findings, and a 👍 on the pull request when it has none. Reactions don't trigger
# workflows, so the run started by each push polls for up to 20 minutes. Findings block the
# merge through the ruleset rule that every review conversation must be resolved first.
# A 👍 has no commit, so it only counts after this run saw Codex start a review (👀) after
# the push. When unsure it stays pending: comment "@codex review" and re-run the check.
# Known gap: a clean review of the previous commit that ends after the next push's review
# started can pass that push. Avoid pushing while Codex is still reviewing (👀).
# The same file lives in every donethatai repo; keep the copies identical.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    # A newer push replaces the waiting run of the previous one.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const CODEX = 'chatgpt-codex-connector[bot]';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const head = context.payload.pull_request.head.sha;
            const pushedAt = Date.parse(context.payload.pull_request.updated_at);
            let reviewStartedAt; // when this run saw Codex's 👀 for a review started after the push
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            async function evaluate() {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open') return { state: 'done', description: 'Pull request is closed.' };
              if (pr.head.sha !== head) return { state: 'done', description: 'A newer push has its own run.' };
              const reviews = await github.paginate(github.rest.pulls.listReviews,
                { owner, repo, pull_number: number, per_page: 100 });
              if (reviews.some(r => r.user.login === CODEX && r.commit_id === head)) {
                return { state: 'success', description: `Codex reviewed ${head.slice(0, 7)}. Resolve its comments before merging.` };
              }
              const reactions = (await github.paginate(github.rest.reactions.listForIssue,
                { owner, repo, issue_number: number, per_page: 100 })).filter(r => r.user.login === CODEX);
              const eyes = reactions.find(r => r.content === 'eyes');
              if (eyes && Date.parse(eyes.created_at) > pushedAt) reviewStartedAt = Date.parse(eyes.created_at);
              if (!eyes && reviewStartedAt
                  && reactions.some(r => r.content === '+1' && Date.parse(r.created_at) > reviewStartedAt)) {
                return { state: 'success', description: `Codex reviewed ${head.slice(0, 7)} with no findings.` };
              }
              return { state: 'pending', description: pr.draft
                ? 'Draft: Codex reviews once it is ready for review.' : 'Waiting for the Codex review.' };
            }

            const deadline = Date.now() + 20 * 60 * 1000;
            let last;
            for (;;) {
              const result = await evaluate();
              if (result.state === 'done') return core.info(result.description);
              if (result.state !== last) {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: head, state: result.state, context: 'AI review',
                  description: result.description,
                  target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                });
                core.info(`${result.state}: ${result.description}`);
                last = result.state;
              }
              if (result.state === 'success') return;
              if (Date.now() > deadline) {
                return core.warning('No Codex review after 20 minutes. Comment "@codex review", then re-run this check.');
              }
              await sleep(30 * 1000);
            }
